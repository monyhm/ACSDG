<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="theme-color" content="#0f766e" />
  <title>Household Budget</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="wrap">
    <header class="top">
      <h1>Household Budget</h1>
      <span id="period" class="period">—</span>
    </header>

    <section class="hero card">
      <div class="remaining">
        <span class="label">Remaining</span>
        <div class="big"><span id="remaining">—</span> <span class="cur" id="cur1"></span></div>
      </div>
      <div class="bar"><div id="barfill" class="barfill"></div></div>
      <div class="hero-row">
        <div><span class="label">Budget</span><b id="budget">—</b></div>
        <div><span class="label">Spent</span><b id="spent">—</b></div>
        <div><span class="label">Used</span><b id="pct">—</b></div>
      </div>
    </section>

    <section class="card">
      <h2>By person</h2>
      <div id="people" class="people"><p class="muted">No spending yet.</p></div>
    </section>

    <section class="card">
      <div class="row-head">
        <h2>Recent</h2>
        <span class="muted" id="updated"></span>
      </div>
      <ul id="tx" class="tx"><li class="muted">No transactions yet.</li></ul>
    </section>

    <section class="card collapsible">
      <details>
        <summary>Quick actions</summary>
        <div class="actions">
          <label>Set monthly budget
            <div class="inline">
              <input id="budgetInput" type="number" inputmode="decimal" placeholder="e.g. 3000" />
              <button id="saveBudget">Save</button>
            </div>
          </label>
          <label>Add a cash spend (not from card)
            <div class="inline">
              <input id="cashAmount" type="number" inputmode="decimal" placeholder="amount" />
              <input id="cashWho" type="text" placeholder="who" />
              <button id="addCash">Add</button>
            </div>
          </label>
          <label>Secret (only if your server requires one)
            <input id="secret" type="password" placeholder="leave blank if none" />
          </label>
          <p class="muted small" id="actionMsg"></p>
        </div>
      </details>
    </section>

    <footer class="muted small">
      Auto-updates every 15s · spends are read from your bank SMS automatically.
    </footer>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
