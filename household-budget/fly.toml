# Fly.io config — always-on alternative with a persistent volume.
#   fly launch --no-deploy        (creates the app, keep this fly.toml)
#   fly volumes create data --size 1
#   fly secrets set WEBHOOK_SECRET="a-long-random-string"
#   fly secrets set BUDGET_CARDS='[{"name":"Abdulrahman","last4":"1234"},{"name":"Partner","last4":"5678"}]'
#   fly deploy
app = "household-budget"
primary_region = "fra"   # pick the region closest to you (e.g. fra, dxb via cdg, bom)

[build]
  dockerfile = "Dockerfile"

[env]
  BUDGET_DB = "/data/budget.db"
  BUDGET_CURRENCY = "SAR"
  BUDGET_DEFAULT_BUDGET = "3000"
  BUDGET_CYCLE_START_DAY = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"     # stay on so a spending SMS never hits a sleeping app
  min_machines_running = 1

[[mounts]]
  source = "data"
  destination = "/data"
