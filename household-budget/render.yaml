# Render Blueprint — deploy with one click from the Render dashboard.
# https://render.com  ->  New  ->  Blueprint  ->  pick this repo.
services:
  - type: web
    name: household-budget
    runtime: docker
    dockerfilePath: household-budget/Dockerfile
    dockerContext: household-budget
    # "starter" keeps the app always-on AND lets us attach a persistent disk
    # so your budget history survives restarts. Use "free" only for testing
    # (it sleeps when idle and wipes data on redeploy).
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: WEBHOOK_SECRET          # set this in the dashboard (a long random string)
        sync: false
      - key: BUDGET_CARDS            # set in dashboard, e.g.
        sync: false                  #   [{"name":"Abdulrahman","last4":"1234"},{"name":"Partner","last4":"5678"}]
      - key: BUDGET_DB
        value: /data/budget.db
      - key: BUDGET_CURRENCY
        value: SAR
      - key: BUDGET_DEFAULT_BUDGET
        value: "3000"
      - key: BUDGET_CYCLE_START_DAY  # 1 = calendar month; set to salary day e.g. 27
        value: "1"
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
