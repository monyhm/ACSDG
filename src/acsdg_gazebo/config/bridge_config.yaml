# ros_gz_bridge configuration for ACSDG Gazebo ↔ ROS2 integration.
#
# The ROS 2 Humble `ros_gz_bridge` is built for Ignition Fortress
# (ign.msgs / ign.transport) and does not interoperate with Gazebo
# Harmonic's gz.msgs / gz.transport13 — messages are emitted with the
# wrong type strings, and neither side delivers. All cmd_vel and
# odometry bridging is therefore handled by `gz_bridge_shim` (Python,
# using the native gz.transport13 bindings).
#
# Only /clock is still routed through the stock bridge — the Clock
# message round-trips cleanly because both the ROS time source and
# Gazebo's clock are symmetric and trivially convertible.

# ── Simulation clock ──────────────────────────────────────────────────────────
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
