# ── Enemy drone velocity commands (ROS → Gazebo) ─────────────────────────────
# enemy_driver_node publishes geometry_msgs/Twist; bridged to gz.msgs.Twist
# which the VelocityControl plugin consumes on /model/enemy_N/cmd_vel
- ros_topic_name: "/enemy_1/cmd_vel"
  gz_topic_name: "/model/enemy_1/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/enemy_2/cmd_vel"
  gz_topic_name: "/model/enemy_2/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

