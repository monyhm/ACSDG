# ros_gz_bridge configuration for ACSDG Gazebo ↔ ROS2 integration.
# ROS topic names mirror Gazebo topic names so downstream nodes subscribe
# to the same path regardless of whether Gazebo is running.

# ── Simulation clock ──────────────────────────────────────────────────────────
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# ── Enemy drone odometry (Gazebo → ROS, same topic name both sides) ───────────
- ros_topic_name: "/model/enemy_1/odometry"
  gz_topic_name: "/model/enemy_1/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/model/enemy_2/odometry"
  gz_topic_name: "/model/enemy_2/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

